      en_us: |
        Review before enabling scheduled renaming. This app will process the folder mapped to /media every 30 minutes and may change file and folder names. Check the selected folder, review the preview, and make sure you have a verified backup. Do not assume changes can be undone. Do not expose port 8098 to the internet.
